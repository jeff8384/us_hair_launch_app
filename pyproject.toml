[project]
name = "us-hair-launch"
version = "0.1.0"
description = "Local US hair care competitor analysis and PDP copy workflow"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "jsonschema>=4.23.0",
  "openpyxl>=3.1.0",
  "orjson>=3.10.0",
  "pydantic>=2.11.0",
  "typer>=0.16.0",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.30.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
us-hair-launch = "us_hair_launch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/us_hair_launch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "T20"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src"]
reportUnusedFunction = false
